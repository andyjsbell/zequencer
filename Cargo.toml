[package]
name = "zequencer"
version = "0.1.0"
edition = "2024"

[dependencies]
redb = "4.2.0"
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
hex = "0.4.3"
serde_with = { version = "3.22.0", default-features = false, features = ["std", "macros", "hex"] }
tokio = { version = "1.53.1", features = ["full"] }
postcard = { version = "1.1.3", features = ["use-std"] }
sha3 = "0.12.0"
async-trait = "0.1.92"

[dev-dependencies]
tempfile = "3.27.0"
serde_json = "1.0.151"
