[package]
name = "zequencer"
version = "0.1.0"
edition = "2024"

[dependencies]
redb = "4.2.0"
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
hex = "0.4.3"
serde_with = { version = "3.22.0", default-features = false, features = ["std", "macros", "hex"] }
tokio = { version = "1.53.1", features = ["full"] }
postcard = { version = "1.1.3", features = ["use-std"] }
sha3 = "0.12.0"
async-trait = "0.1.92"
axum = "0.8.9"
anyhow = "1.0.104"
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ff = "0.5"
ark-ec = "0.5"
ark-std = "0.5"
ark-serialize = "0.5"
ark-relations = "0.5"
ark-r1cs-std = "0.5"
ark-snark = "0.5"
ark-groth16 = { version = "0.5", features = ["r1cs"] }
ark-crypto-primitives = { version = "0.5", features = ["sponge", "r1cs", "crh"] }

# Arkworks does field and pairing arithmetic in tight loops; unoptimised it is
# roughly two orders of magnitude slower, which puts a Groth16 setup well past
# any reasonable test timeout. Only dependencies are optimised, so this crate's
# own code still carries debug info.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
tempfile = "3.27.0"
serde_json = "1.0.151"

[[bench]]
name = "submit"
harness = false
